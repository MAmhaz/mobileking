function renderSections(comp){const v=$("view");const secs=SECTIONS[comp];const color=LABELS[comp].color;v.innerHTML=`<div class="sections fade-in">${secs.map(s=>`<button class="bg-card" style="${bgStyle(s.img)};border:1px solid ${color}40;" onclick="go('${comp}/${s.key}')"><span class="badge">${(DATA[comp][s.key]||[]).length} خيار</span><div class="content"><div class="t">${s.title}</div><div class="d">${s.desc}</div></div><span class="arrow" style="color:var(--gold)">${SVG.arrowLeft}</span></button>`).join("")}</div>`}
function renderItems(comp,secKey){const v=$("view");const items=(DATA[comp][secKey]||[]);const s=SECTIONS[comp].find(x=>x.key===secKey);const color=LABELS[comp].color;const title=s?s.title:secKey;if(!items.length){v.innerHTML=`<div class="item fade-in" style="grid-column:1/-1">لا توجد عناصر حالياً.</div>`;return}v.innerHTML=`<div class="grid fade-in">${items.map((it,index)=>{const imgKey=secKey==='cards'?cardImageKey(comp,it.name):null;const imgSrc=imgKey?IMAGES[imgKey]:null;const msg=encodeURIComponent(`مرحبا Mobile King، بدي اطلب ${title} - ${comp==='alfa'?'ألفا':'تاتش'} - ${it.name} بسعر ${fmt(it.price)} ${CURRENCY}`);const delay=Math.min(index*.05,.4);return`<div class="item" style="border-top:3px solid ${color};animation-delay:${delay}s">${imgSrc?`<img src="${imgSrc}" alt="" onerror="this.style.display='none'">`:""}<div class="n">${escapeHtml(it.name)}</div><div class="p">${fmt(it.price)}</div><div class="cur">${CURRENCY}</div><a class="btn-wa" href="https://wa.me/${encodeURIComponent(DATA.whatsapp)}?text=${msg}" target="_blank" rel="noopener">${SVG.whatsapp} اطلب واتساب</a></div>`}).join("")}</div>`}
