<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>لوحة تحكم Mobile King</title>
<style>
:root{
  --bg:#0f1115; --card:#171b24; --card2:#1f2430; --text:#f2f4f8; --muted:#9aa3b2;
  --gold:#ffd700; --green:#22c55e; --red:#ef4444; --blue:#3b82f6;
}
*{box-sizing:border-box;font-family:system-ui,Tahoma,sans-serif}
body{margin:0;background:var(--bg);color:var(--text);padding:16px;padding-bottom:120px}
.wrap{max-width:960px;margin:0 auto}
h1{font-size:22px;margin:8px 0 4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.box{background:var(--card);border:1px solid rgba(255,255,255,.06);border-radius:16px;
  padding:16px;margin-bottom:16px}
.box h2{font-size:16px;margin:0 0 12px;color:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:600px){.grid2{grid-template-columns:1fr}}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 4px;font-weight:700}
input{width:100%;padding:10px 12px;border:1px solid rgba(255,255,255,.1);
  border-radius:10px;background:var(--card2);color:var(--text);font:inherit}
input:focus{outline:none;border-color:var(--gold)}
.row{display:grid;grid-template-columns:1fr 140px 44px;gap:8px;align-items:center;margin-bottom:8px}
.row input{margin:0}
.del{background:var(--red);color:#fff;border:0;border-radius:10px;height:40px;
  cursor:pointer;font-size:18px;font-weight:900}
.add{background:var(--green);color:#fff;border:0;border-radius:10px;
  padding:10px 14px;cursor:pointer;font-weight:800;margin-top:6px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{background:var(--card2);color:var(--muted);border:0;padding:8px 14px;
  border-radius:10px;cursor:pointer;font-weight:700;font-size:13px}
.tab.active{background:var(--gold);color:#000}
.sec-title{display:flex;justify-content:space-between;align-items:center;margin:18px 0 8px}
.sec-title h3{margin:0;font-size:15px}
.actions{position:fixed;bottom:0;left:0;right:0;background:var(--card);
  border-top:1px solid rgba(255,255,255,.08);padding:12px;display:flex;gap:8px;
  justify-content:center;flex-wrap:wrap;z-index:50}
.actions button{border:0;border-radius:12px;padding:12px 20px;font-weight:800;
  cursor:pointer;font-size:14px;color:#fff}
.btn-save{background:var(--blue)}
.btn-export{background:var(--gold);color:#000}
.btn-copy{background:var(--green)}
.btn-reset{background:var(--red)}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
  background:var(--green);color:#fff;padding:10px 20px;border-radius:12px;
  font-weight:800;opacity:0;transition:opacity .3s;z-index:100;pointer-events:none}
.toast.show{opacity:1}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>لوحة تحكم Mobile King</h1>
  <div class="sub">عدّل الأسعار — التعديلات تُحفظ تلقائياً في المتصفح — ثم صدّر `prices.json` وارفعه على GitHub.</div>

  <div class="box">
    <h2>معلومات المحل</h2>
    <div class="grid2">
      <div><label>اسم المحل</label><input id="store"></div>
      <div><label>رقم واتساب (بدون +)</label><input id="whatsapp"></div>
      <div><label>العنوان</label><input id="address"></div>
      <div><label>ساعات الدوام</label><input id="workingHours"></div>
      <div><label>رابط انستغرام</label><input id="instagram"></div>
      <div><label>رابط فيسبوك</label><input id="facebook"></div>
      <div><label>رابط تيك توك</label><input id="tiktok"></div>
      <div><label>اعلان مهم</label><input id="announcement"></div>
    </div>
  </div>

  <div class="box">
    <div class="tabs" id="tabs"></div>
    <div id="editor"></div>
  </div>
</div>

<div class="actions">
  <button class="btn-save"   onclick="saveLocal()">حفظ محلي</button>
  <button class="btn-copy"   onclick="copyJSON()">نسخ JSON</button>
  <button class="btn-export" onclick="exportJSON()">تصدير prices.json</button>
  <button class="btn-reset"  onclick="resetData()">استعادة الأصل</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Mobile King — admin.html
   - يقرأ prices.json
   - يعدّل محلياً (localStorage)
   - يصدّر/ينسخ JSON
   ============================================================ */

const STORAGE_KEY = "mobileking_prices_draft";
const SECTIONS = {
  alfa:  ["dollars","cards","days","ushare"],
  touch: ["dollars","cards","days"],
};
const LABELS = { alfa:"Alfa ألفا", touch:"Touch تاتش" };
const SECTION_TITLES = {
  dollars:"دولارات", cards:"تشريج", days:"أيام", ushare:"U_share",
};
const META_KEYS = ["store","whatsapp","address","workingHours","instagram","facebook","tiktok","announcement"];

let DATA = null;
let original = null;
let currentComp = "alfa";

const $ = id => document.getElementById(id);
const toast = (msg) => {
  const t = $("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove("show"), 1800);
};

/* ---------- load ---------- */
fetch('prices.json', { cache:'no-store' })
  .then(r => r.json())
  .then(d => {
    original = JSON.parse(JSON.stringify(d));
    const draft = localStorage.getItem(STORAGE_KEY);
    DATA = draft ? JSON.parse(draft) : JSON.parse(JSON.stringify(d));
    // ضمان وجود كل الأقسام
    for(const c of Object.keys(SECTIONS)){
      DATA[c] = DATA[c] || {};
      for(const s of SECTIONS[c]) DATA[c][s] = DATA[c][s] || [];
    }
    renderMeta();
    renderTabs();
    renderEditor();
  })
  .catch(err => {
    document.body.innerHTML = `<div style="padding:20px;color:#fff">تعذر تحميل prices.json — شغّل الصفحة عبر سيرفر (GitHub Pages أو http-server).</div>`;
    console.error(err);
  });

/* ---------- meta ---------- */
function renderMeta(){
  META_KEYS.forEach(k => {
    const el = $(k);
    if(!el) return;
    el.value = DATA[k] || "";
    el.addEventListener("input", () => {
      DATA[k] = el.value;
      persist();
    });
  });
}

/* ---------- tabs ---------- */
function renderTabs(){
  const t = $("tabs");
  t.innerHTML = "";
  Object.keys(SECTIONS).forEach(c => {
    const b = document.createElement("button");
    b.className = "tab" + (c === currentComp ? " active" : "");
    b.textContent = LABELS[c];
    b.onclick = () => { currentComp = c; renderTabs(); renderEditor(); };
    t.appendChild(b);
  });
}

/* ---------- editor ---------- */
function renderEditor(){
  const box = $("editor");
  box.innerHTML = "";
  SECTIONS[currentComp].forEach(secKey => {
    const sec = document.createElement("div");
    const title = document.createElement("div");
    title.className = "sec-title";
    title.innerHTML = `<h3>${SECTION_TITLES[secKey] || secKey}</h3>`;
    const addBtn = document.createElement("button");
    addBtn.className = "add";
    addBtn.textContent = "+ إضافة عنصر";
    addBtn.onclick = () => {
      DATA[currentComp][secKey].push({ name:"عنصر جديد", price:0 });
      persist(); renderEditor();
    };
    title.appendChild(addBtn);
    sec.appendChild(title);

    const list = DATA[currentComp][secKey];
    if(!list.length){
      const empty = document.createElement("div");
      empty.className = "hint";
      empty.textContent = "لا توجد عناصر في هذا القسم.";
      sec.appendChild(empty);
    }
    list.forEach((item, i) => {
      const row = document.createElement("div");
      row.className = "row";

      const nameIn = document.createElement("input");
      nameIn.value = item.name;
      nameIn.placeholder = "الاسم";
      nameIn.addEventListener("input", () => {
        DATA[currentComp][secKey][i].name = nameIn.value;
        persist();
      });

      const priceIn = document.createElement("input");
      priceIn.type = "number";
      priceIn.value = item.price;
      priceIn.placeholder = "السعر";
      priceIn.min = "0";
      priceIn.addEventListener("input", () => {
        DATA[currentComp][secKey][i].price = Math.max(0, Number(priceIn.value) || 0);
        persist();
      });

      const del = document.createElement("button");
      del.className = "del";
      del.textContent = "×";
      del.title = "حذف";
      del.onclick = () => {
        if(confirm("حذف هذا العنصر؟")){
          DATA[currentComp][secKey].splice(i,1);
          persist(); renderEditor();
        }
      };

      row.appendChild(nameIn);
      row.appendChild(priceIn);
      row.appendChild(del);
      sec.appendChild(row);
    });

    box.appendChild(sec);
  });
}

/* ---------- persistence ---------- */
function persist(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(DATA)); }catch(e){}
}

function saveLocal(){ persist(); toast("تم الحفظ محلياً ✓"); }

function copyJSON(){
  const text = buildJSON();
  navigator.clipboard.writeText(text).then(
    () => toast("تم نسخ JSON ✓"),
    () => {
      // fallback
      const ta = document.createElement("textarea");
      ta.value = text; document.body.appendChild(ta); ta.select();
      document.execCommand("copy"); ta.remove();
      toast("تم النسخ ✓");
    }
  );
}

function exportJSON(){
  const blob = new Blob([buildJSON()], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "prices.json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("تم التصدير ✓");
}

function buildJSON(){
  // تحديث تاريخ آخر تعديل بصيغة DD-MM-YYYY
  const d = new Date();
  const pad = n => String(n).padStart(2,"0");
  DATA.lastUpdate = `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()}`;
  return JSON.stringify(DATA, null, 2);
}

function resetData(){
  if(!confirm("استعادة البيانات الأصلية من prices.json؟ سيتم فقدان تعديلاتك المحلية.")) return;
  localStorage.removeItem(STORAGE_KEY);
  DATA = JSON.parse(JSON.stringify(original));
  renderMeta(); renderEditor();
  toast("تمت الاستعادة ✓");
}
</script>
</body>
</html>
